[project]
name = "askwiki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Haeohreum Kim", email = "notoverfit@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "torch>=2.15.0",
]

[project.scripts]
askwiki = "askwiki:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
