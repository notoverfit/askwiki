[project]
name = "askwiki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Haeohreum Kim", email = "notoverfit@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyprojroot>=0.3.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
askwiki = "askwiki:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
